<rect class="bar" x="210" y="70" width="400" height="24" rx="4"/>
<text class="count" x="620" y="87">10.245</text>
<text class="label" x="20" y="132">Kan vurderes</text>
<rect class="bar" x="210" y="116" width="348" height="24" rx="4"/>
